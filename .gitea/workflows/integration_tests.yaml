name: Miziptools tests
run-name: MizipTools tests
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Debug 
        run: echo "${{ github.event.workflow_run.head_commit.message }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-daemon-system libvirt-clients qemu-system-x86-64 qemu-kvm udev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

      - name: Run Flutter tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          profile: pixel_7_pro
          script: flutter test --coverage integration_test/full_app_test.dart

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          
      - name: Build debug package
        if: github.event.workflow_run.head_commit.message == 'build_debug'
        run: flutter build apk --debug

      - name: Rename build    
        if: github.event.workflow_run.head_commit.message == 'build_debug'
        run: mv ./build/app/outputs/flutter-apk/app-debug.apk ./miziptools-debug.apk

      - uses: actions/upload-artifact@v3    
        if: github.event.workflow_run.head_commit.message == 'build_debug'
        with:
          name: miziptools-debug-build
          path: ./miziptools-debug.apk
          overwrite: true
          archive: false
          retention-days: 7

