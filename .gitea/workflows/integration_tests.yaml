  build:
    runs-on: ubuntu-latest
    if: success() #&& github.ref == 'refs/heads/master'

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release package
        run: flutter build apk --release

      - name: Rename build
        run: mv ./build/app/outputs/flutter-apk/app-release.apk ./miziptools.apk

      - uses: actions/upload-artifact@v3
        with:
          name: miziptools-release-build
          path: ./miziptools.apk
          overwrite: true
          archive: false
      
      - name: Generate release text
        run: ruby scripts/get_changelog.rb 

      - uses: akkuman/gitea-release-action@v1
        with:
          files: ./miziptools.apk
          body_path: ./release_text
