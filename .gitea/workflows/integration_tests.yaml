name: Miziptools tests
run-name: MizipTools tests
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-daemon-system libvirt-clients qemu-system-x86-64 qemu-kvm udev
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

      - name: Run Flutter tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          cores: 4
          ram-size: 4096M
          profile: pixel_7_pro
          script: flutter test --coverage integration_test/full_app_test.dart

      - name: Update code coverage
        env:
          TEST_COV_KEY: ${{ secrets.TEST_COV_KEY }}
        run: ruby ./coverage/get_total_coverage.rb
