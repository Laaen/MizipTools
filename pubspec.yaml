name: miziptools
description: "Android App written in Flutter made to modify MiZip NFC tags."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.1

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_nfc_kit:
    git:
      url: https://github.com/Laaen/flutter_nfc_kit.git
      ref: agp_migration
  google_fonts: ^8.0.2
  logging: ^1.3.0
  logging_appenders: ^2.0.0+1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  synchronized: ^3.3.0+3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.26.2

flutter:
  uses-material-design: true
  assets:
    - google_fonts/
